[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dearnana"
version = "0.1.2"
description = "Find and rank nursing homes using CMS public data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["nursing home", "senior care", "CMS", "healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.78",
    "click>=8.1",
    "pydantic>=2.0",
    "geopy>=2.4",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/miaomiaocui/dearnana"
Source = "https://github.com/miaomiaocui/dearnana"
"Bug Tracker" = "https://github.com/miaomiaocui/dearnana/issues"

[project.scripts]
dearnana = "dearnana.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dearnana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
